name: Test

# - On every push: only lint and the Pix check. Nothing is downloaded.
# - On demand (workflow_dispatch) and once a day (schedule): the full suite, which needs a throwaway local copy of the
#   game in tests/.game. It is fetched file by file from pokesurvivor.com by tests/espelhar-jogo.cjs (static files only,
#   plain GET, generic user agent, no cookies, no login) and served locally as https://pokesurvivor.com. Firebase and the
#   leaderboard seal are faked, so nothing reaches the real servers. The copy is only used inside the job: it is never
#   committed, cached or uploaded as an artifact (the game is PolyForm Noncommercial, sprites CC BY-NC).
#   tests/e2e.cjs reads the game's CSS, font and sprites from that copy, so it runs with the full suite.
# - GitHub pauses scheduled workflows in a public repository after 60 days without repository activity.
#
#  - lint: web-ext lint
#  - pix: tests/pix.cjs (no browser)
#  - chromium (full suite): tests/lab-mapa.cjs (every game module found by its shape), tests/e2e.cjs (starter picker
#    and quiz on a simulated quiz page) and tests/e2e-farm.cjs (real game, auto farm)
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest (Chromium MV3)
        run: node tests/manifest.cjs extension

      # web-ext lint is built for Firefox: on a Chromium-only manifest it always reports the service worker and the
      # missing add-on id. Those two are filtered out here; anything else still fails the job.
      - name: web-ext lint
        run: |
          npx --yes web-ext@8 lint --source-dir extension --self-hosted --output json > lint.json || true
          jq '.summary' lint.json
          FILTER='[.errors[] | select(.code != "EXTENSION_ID_REQUIRED" and (.code != "MANIFEST_FIELD_UNSUPPORTED" or (.message | test("service_worker") | not)))]'
          jq -r "$FILTER[] | \"ERROR \(.code) \(.file // \"\") \(.message)\"" lint.json
          test "$(jq "$FILTER | length" lint.json)" = "0"

  pix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pix codes
        run: node tests/pix.cjs

  chromium:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      ESPELHAR: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Playwright
        run: |
          npm i --no-save --silent playwright@1
          npx playwright install --with-deps chromium

      - name: Game build (local copy from pokesurvivor.com)
        run: |
          node tests/espelhar-jogo.cjs tests/.game | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Game modules found by shape
        run: node tests/lab-mapa.cjs

      - name: Starter picker and quiz
        run: node tests/e2e.cjs extension out/e2e

      - name: Auto farm on the real game
        run: node tests/e2e-farm.cjs extension tests/.game out/farm 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: out/
